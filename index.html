<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>５分だけゲームする</title>
  <meta name="description" content="５分だけ遊べるゲームを少しずつ追加していくサイトです。" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <p class="site-subtitle">気軽に遊べるミニゲーム置き場</p>
      <h1 class="site-title">５分だけゲームする</h1>
      <p class="site-lead">ただいま準備中</p>
      <p class="site-text">
        ここに、これから新しいゲームや記事を少しずつ追加していきます。
      </p>
    </div>
  </header>

  <main class="container">
    <section class="section">
      <h2 class="section-title">これから追加するコンテンツ</h2>

      <div class="card-grid">
        <a class="card" href="coming-soon.html">
          <div class="card-image image-1">
            <span class="card-badge">準備中</span>
          </div>
          <div class="card-body">
            <h3 class="card-title">はじめてのゲーム</h3>
            <p class="card-text">
              最初に公開予定のミニゲームです。
            </p>
          </div>
        </a>

        <a class="card" href="coming-soon.html">
          <div class="card-image image-2">
            <span class="card-badge">準備中</span>
          </div>
          <div class="card-body">
            <h3 class="card-title">次に公開するゲーム</h3>
            <p class="card-text">
              ここに次の作品の説明を書いていきます。
            </p>
          </div>
        </a>

        <a class="card" href="coming-soon.html">
          <div class="card-image image-3">
            <span class="card-badge">準備中</span>
          </div>
          <div class="card-body">
            <h3 class="card-title">記事・遊び方ページ</h3>
            <p class="card-text">
              ゲーム紹介や遊び方の記事ページも追加できます。
            </p>
          </div>
        </a>
      </div>
    </section>
  </main>
</body>
</html>
